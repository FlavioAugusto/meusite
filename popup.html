<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .status {
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .status.success {
            color: #4ade80;
        }
        
        .status.error {
            color: #f87171;
        }
        
        .status.warning {
            color: #fbbf24;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .data-counter {
            text-align: center;
            font-size: 14px;
            margin: 10px 0;
        }
        
        .counter-number {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #4ade80;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .instructions {
            font-size: 11px;
            opacity: 0.7;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗺️ Maps Data Extractor</h1>
        <p>Extrator de dados do Google Maps</p>
    </div>
    
    <div class="card">
        <div id="status" class="status">Aguardando...</div>
        <div class="progress-bar">
            <div id="progressBar" class="progress-fill"></div>
        </div>
        <div class="data-counter">
            <div>Dados coletados: <span id="dataCount" class="counter-number">0</span></div>
        </div>
    </div>
    
    <div class="card">
        <button id="startExtraction" class="btn btn-primary">
            🚀 Iniciar Extração
        </button>
        <button id="downloadExcel" class="btn btn-success" disabled>
            📊 Baixar Excel
        </button>
        <button id="clearData" class="btn" style="background: #ef4444; color: white;">
            🗑️ Limpar Dados
        </button>
    </div>
    
    <div class="card">
        <div class="instructions">
            <strong>📝 Como usar:</strong><br>
            1. Vá para o Google Maps<br>
            2. Pesquise por empresas/locais<br>
            3. Clique em "Iniciar Extração"<br>
            4. Aguarde a coleta dos dados<br>
            5. Baixe o arquivo Excel
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
